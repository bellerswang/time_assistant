<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#161614">
  <title>Loomi · 私人记录</title>
  <style>
    :root{font-family:system-ui,-apple-system,sans-serif;color-scheme:dark;background:#10110f;color:#f5f1e8}
    body{min-height:100dvh;display:grid;place-items:center;margin:0;padding:22px;box-sizing:border-box}
    main{width:min(100%,380px);text-align:center}
    h1{font-size:2.8rem;letter-spacing:-.06em;margin:0 0 8px}
    p{color:#bdbdb7;line-height:1.65}
    button{border:0;border-radius:18px;background:#bdecc1;color:#15251a;font-size:1.05rem;font-weight:700;padding:16px 22px;width:100%;margin-top:16px;cursor:pointer}
    button:disabled{opacity:.5;cursor:wait}
    .secondary{background:#30342f;color:#f5f1e8}
    #status{min-height:3em;font-size:.9rem}
  </style>
</head>
<body>
  <main>
    <h1>Loomi</h1>
    <p id="intro">你的私人录音空间。使用设备的 Face ID、指纹或屏幕锁进入。</p>
    <section id="login-section"><button id="login" type="button">使用通行密钥进入</button></section>
    <section id="setup-section" hidden>
      <p id="setup-intro">首次设置：先用原账号确认身份，再为这台设备创建通行密钥。</p>
      <button id="verify-google" class="secondary" type="button">用原账号确认身份</button>
      <button id="register" type="button" disabled>创建通行密钥</button>
    </section>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script>
    const setup = location.pathname === '/auth/setup';
    const adding = location.pathname === '/auth/add-passkey';
    const registration = setup || adding;
    const status = document.getElementById('status');
    const loginButton = document.getElementById('login');
    const registerButton = document.getElementById('register');
    let ownerToken = '';
    document.getElementById('login-section').hidden = registration;
    document.getElementById('setup-section').hidden = !registration;
    if (adding) {
      document.getElementById('setup-intro').textContent = '为已登录的 Loomi 添加一把通行密钥。';
      document.getElementById('verify-google').hidden = true;
      registerButton.disabled = false;
    }

    function decode(value) {
      const base64 = value.replace(/-/g, '+').replace(/_/g, '/');
      const binary = atob(base64.padEnd(Math.ceil(base64.length / 4) * 4, '='));
      return Uint8Array.from(binary, c => c.charCodeAt(0));
    }
    function encode(value) {
      const bytes = new Uint8Array(value);
      let binary = '';
      for (const byte of bytes) binary += String.fromCharCode(byte);
      return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }
    function serialize(credential) {
      const response = credential.response;
      const result = {
        id: credential.id, rawId: encode(credential.rawId), type: credential.type,
        clientExtensionResults: credential.getClientExtensionResults(),
        response: { clientDataJSON: encode(response.clientDataJSON) }
      };
      if (response.attestationObject) {
        result.response.attestationObject = encode(response.attestationObject);
        result.response.transports = response.getTransports?.() || [];
      } else {
        result.response.authenticatorData = encode(response.authenticatorData);
        result.response.signature = encode(response.signature);
        result.response.userHandle = response.userHandle ? encode(response.userHandle) : null;
      }
      return result;
    }
    async function post(path, credential) {
      const headers = {'Content-Type':'application/json'};
      if (ownerToken) headers.Authorization = `Bearer ${ownerToken}`;
      const response = await fetch(path, {
        method:'POST', credentials:'same-origin', headers,
        body: JSON.stringify(credential ? {credential} : {})
      });
      const result = await response.json();
      if (!response.ok) throw new Error(result.detail || '操作失败');
      return result;
    }
    function busy(button, value) { button.disabled = value; if (value) status.textContent = '正在验证…'; }

    loginButton.addEventListener('click', async () => {
      busy(loginButton, true);
      try {
        if (!window.PublicKeyCredential) throw new Error('此浏览器不支持通行密钥。');
        const options = await post('/auth/login/options');
        options.challenge = decode(options.challenge);
        options.allowCredentials = (options.allowCredentials || []).map(item => ({...item, id:decode(item.id)}));
        const credential = await navigator.credentials.get({publicKey:options});
        if (!credential) throw new Error('未选择通行密钥。');
        await post('/auth/login/complete', serialize(credential));
        location.replace(location.pathname === '/auth/reauth' ? '/auth/add-passkey' : '/');
      } catch (error) { status.textContent = error.message || '登录失败'; busy(loginButton, false); }
    });

    async function verifyOriginalAccount() {
      const scripts = [
        'https://www.gstatic.com/firebasejs/11.10.0/firebase-app-compat.js',
        'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth-compat.js',
        '/firebase-config.js'
      ];
      for (const src of scripts) {
        await new Promise((resolve, reject) => {
          const script = document.createElement('script');
          script.src = src; script.onload = resolve; script.onerror = reject;
          document.head.appendChild(script);
        });
      }
      firebase.initializeApp(window.LOOMI_FIREBASE_CONFIG);
      const auth = firebase.auth();
      await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
      const result = await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
      ownerToken = await result.user.getIdToken();
      registerButton.disabled = false;
      status.textContent = '身份已确认，现在创建通行密钥。';
    }
    document.getElementById('verify-google').addEventListener('click', async () => {
      const button = document.getElementById('verify-google');
      busy(button, true);
      try { await verifyOriginalAccount(); }
      catch (error) { status.textContent = error.message || '身份确认失败'; }
      finally { button.disabled = false; }
    });
    registerButton.addEventListener('click', async () => {
      busy(registerButton, true);
      try {
        if (!window.PublicKeyCredential) throw new Error('此浏览器不支持通行密钥。');
        const options = await post('/auth/register/options');
        options.challenge = decode(options.challenge);
        options.user.id = decode(options.user.id);
        options.excludeCredentials = (options.excludeCredentials || []).map(item => ({...item,id:decode(item.id)}));
        const credential = await navigator.credentials.create({publicKey:options});
        if (!credential) throw new Error('未创建通行密钥。');
        await post('/auth/register/complete', serialize(credential));
        status.textContent = '通行密钥已创建。';
        if (adding) location.replace('/');
        else {
          await firebase.auth().signOut();
          location.replace('/auth/login');
        }
      } catch (error) { status.textContent = error.message || '创建失败'; }
      finally { registerButton.disabled = false; }
    });
  </script>
</body>
</html>
